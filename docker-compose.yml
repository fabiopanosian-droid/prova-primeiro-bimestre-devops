services:
  db:
    image: postgres:15-alpine
    container_name: reservas-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - reservas_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./app
    container_name: reservas-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - reservas_network
    depends_on:
      db:
        condition: service_healthy

networks:
  reservas_network:
    driver: bridge

volumes:
  postgres_data:
